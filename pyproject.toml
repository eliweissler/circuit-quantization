[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "circuit-quantization"
version = "0.1.0"
description = "Symbolic quantization of general superconducting circuits"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
authors = [{name = "Eli Weissler"}]
dependencies = [
  "networkx>=3.4",
  "sympy>=1.13",
]

[project.optional-dependencies]
optimization = [
  "func-timeout>=4.3",
  "numpy>=1.26",
  "pandas>=2.2",
  "tqdm>=4.66",
  "z3-solver>=4.13",
]
test = [
  "func-timeout>=4.3",
  "numpy>=1.26",
  "pandas>=2.2",
  "pytest>=8.3",
  "scqubits>=4.2",
  "tqdm>=4.66",
  "z3-solver>=4.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"circuit_quantization.optimization._vendor" = ["poly_solver.sing", "VENDORED.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
